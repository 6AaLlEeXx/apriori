[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-lora-workbench"
version = "0.1.0"
description = "Orchestrated MLX LoRA subset training and kernel score-delta experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
  "scipy>=1.10",
  "seaborn>=0.13",
  "pyyaml>=6.0",
  "datasets>=2.18",
  "mlx>=0.22; platform_system == 'Darwin'",
  "mlx-lm>=0.21; platform_system == 'Darwin'",
]

[project.scripts]
mlx-lora-run = "cli.run:main"
mlx-lora-run-kernel = "cli.run_kernel:main"
mlx-lora-make-kernel-paper-figures = "cli.make_kernel_paper_figures:main"
mlx-lora-prepare-data = "cli.prepare_data:main"
mlx-lora-compare-adapters = "cli.compare_adapters:main"

[dependency-groups]
dev = [
  "basedpyright>=1.39.3",
  "pytest>=7.4",
  "ruff>=0.15.11",
]

[tool.uv]
package = true

[tool.setuptools]
py-modules = [
  "data_prep",
  "mlops",
  "paths",
]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cli*", "kernel*", "reporting*", "transformations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
