[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-lora-workbench"
version = "0.1.0"
description = "Self-contained MLX LoRA training, evaluation, and kernel score-delta experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "datasets>=2.18",
  "mlx>=0.22; platform_system == 'Darwin'",
  "mlx-lm>=0.21; platform_system == 'Darwin'",
]

[project.scripts]
mlx-lora-run = "cli.run:main"
mlx-lora-eval-preds = "cli.eval_predictions:main"
mlx-lora-make-report = "cli.make_report:main"
mlx-lora-run-kernel = "cli.run_kernel:main"
mlx-lora-make-kernel-report = "cli.make_kernel_report:main"
mlx-lora-make-kernel-comparison = "cli.make_kernel_comparison_report:main"
mlx-lora-make-kernel-paper-figures = "cli.make_kernel_paper_figures:main"
mlx-lora-make-adapter-comparison = "cli.make_adapter_comparison_report:main"
mlx-lora-generate-kernel-configs = "cli.generate_kernel_configs:main"
mlx-lora-prepare-data = "cli.prepare_data:main"
mlx-lora-compare-adapters = "cli.compare_adapters:main"
smollm2-run-lora = "cli.run:main"
smollm2-eval-preds = "cli.eval_predictions:main"
smollm2-make-report = "cli.make_report:main"
smollm2-run-kernel = "cli.run_kernel:main"
smollm2-make-kernel-report = "cli.make_kernel_report:main"
smollm2-make-kernel-comparison = "cli.make_kernel_comparison_report:main"
smollm2-make-kernel-paper-figures = "cli.make_kernel_paper_figures:main"
smollm2-make-adapter-comparison = "cli.make_adapter_comparison_report:main"
smollm2-generate-kernel-configs = "cli.generate_kernel_configs:main"
smollm2-prepare-data = "cli.prepare_data:main"
smollm2-compare-adapters = "cli.compare_adapters:main"

[dependency-groups]
dev = [
  "basedpyright>=1.39.3",
  "pytest>=7.4",
  "ruff>=0.15.11",
]

[tool.uv]
package = true

[tool.setuptools]
py-modules = [
  "data_prep",
  "eval",
  "feature_pipeline",
  "mlops",
  "paths",
  "selector_algorithms",
]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cli*", "kernel*", "projection*", "reporting*", "transformations*", "estimator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
