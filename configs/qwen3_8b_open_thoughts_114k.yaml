extends: base.yaml
dataset_name: open_thoughts_114k
task: reasoning
base_model: mlx-community/Qwen3-8B-4bit
data_dir: data/open_thoughts_114k
run_tags:
  - mlx-lora
  - lora
  - qwen3-8b
  - open-thoughts
  - reasoning
evaluation:
  name: reasoning
  metrics:
    - exact_match
    - token_f1
  primary_metric: token_f1
mlx_args:
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  seed: 42
  mask_prompt: true
  iters: 1500
  num_layers: 16
  max_seq_length: 2048
  grad_checkpoint: true
  steps_per_report: 10
  steps_per_eval: 100
  val_batches: 25
  save_every: 250
  lora_parameters:
    rank: 8
    scale: 20.0
    dropout: 0.0
subset_training:
  iters_policy: match_full_exposure
  min_iters: 1
notes: Qwen3-8B 4-bit reasoning LoRA on OpenThoughts-114k. Conservative for a 24 GB Apple Silicon machine.
