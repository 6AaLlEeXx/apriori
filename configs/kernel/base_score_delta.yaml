dataset_name: dolly
task: generic
base_model: mlx-community/SmolLM2-1.7B-Instruct
data_dir: data/dolly
adapter_path: ""
output_root: results/kernel
backend: lora_ntk
target: score_delta
seed: 42
train_limit: 128
valid_limit: 128
test_limit: 128
kernel:
  method: nystrom
  ridge_lambda: 1.0e-2
  rank: 32
  num_landmarks: 32
backend_args:
  leaf_filter: lora_b_only
run_tags:
  - mlx-lora
  - kernel
notes: Base config for score-delta KRR experiments against a trained LoRA adapter.
