extends: ../base/score_delta.yaml
dataset_name: open_thoughts_114k
task: reasoning
base_model: mlx-community/Qwen3-8B-4bit
prepared_data_dir: data/open_thoughts_114k
adapter_path: ""
feature_backend: score_gradient
krr_fit_examples: 64
validation_examples: 64
test_examples: 128
krr:
  method: nystrom
  ridge_lambda: 1.0e-2
  rank: 32
  num_landmarks: 32
feature_backend_args:
  leaf_filter: lora_b_only
provenance_configs:
  data: configs/data/reasoning/open_thoughts_114k.yaml
  training: configs/train/reasoning/qwen3_8b_open_thoughts_114k.yaml
run_tags:
  - mlx-lora
  - kernel
  - qwen3-8b
  - open-thoughts
notes: score-gradient score-delta KRR for Qwen3-8B OpenThoughts. Keep limits small; feature extraction is expensive.
