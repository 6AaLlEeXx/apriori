source_config:
  data: configs/data/math/openmathreasoning_cot_60k.yaml
  training: configs/qwen3_14b_openmathreasoning_cot_60k.yaml
run_tags:
  - mlx-lora
  - kernel
  - qwen3-14b
  - openmathreasoning
notes: LoRA-NTK score-delta KRR for Qwen3-14B OpenMathReasoning. Start tiny because 14B gradient features are costly.
