extends: base_score_delta.yaml
dataset_name: open_thoughts_114k
task: reasoning
base_model: mlx-community/Qwen3-8B-4bit
data_dir: data/open_thoughts_114k
adapter_path: ""
backend: lora_ntk
train_limit: 64
valid_limit: 64
test_limit: 128
kernel:
  method: nystrom
  ridge_lambda: 1.0e-2
  rank: 32
  num_landmarks: 32
backend_args:
  leaf_filter: lora_b_only
source_config:
  data: configs/data/reasoning/open_thoughts_114k.yaml
  training: configs/qwen3_8b_open_thoughts_114k.yaml
run_tags:
  - mlx-lora
  - kernel
  - qwen3-8b
  - open-thoughts
notes: LoRA-NTK score-delta KRR for Qwen3-8B OpenThoughts. Keep limits small; feature extraction is expensive.
