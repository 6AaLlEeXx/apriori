dataset_name: dolly
task: generic
base_model: mlx-community/SmolLM2-1.7B-Instruct
prepared_data_dir: data/dolly
adapter_path: ""
kernel_results_root: results/kernel
feature_backend: score_gradient
prediction_target: score_delta
seed: 42
krr_fit_examples: 128
validation_examples: 128
test_examples: 128
krr:
  method: nystrom
  ridge_lambda: 1.0e-2
  rank: 32
  num_landmarks: 32
feature_backend_args:
  leaf_filter: lora_b_only
run_tags:
  - mlx-lora
  - kernel
notes: Base config for score-delta KRR experiments against a trained LoRA adapter.
