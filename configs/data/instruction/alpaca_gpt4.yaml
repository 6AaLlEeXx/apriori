dataset_name: alpaca_gpt4
source_dataset: vicgalle/alpaca-gpt4
output_dir: data/alpaca_gpt4
source:
  type: hf
  path: vicgalle/alpaca-gpt4
  split: train
split:
  strategy: ratios
  seed: 42
  valid_ratio: 0.05
  test_ratio: 0.05
mapping:
  type: template
  prompt_parts:
    - Write a helpful response to the following instruction.
    - "Instruction:\n{instruction}"
    - template: "Input:\n{input}"
      when_field: input
  completion_template: "{output}"
filters:
  max_prompt_chars: 4000
  max_completion_chars: 4000
  max_total_chars: 7000
metadata:
  task: generic
  notes: Alpaca prompts answered by GPT-4 — higher-quality responses than vanilla Alpaca.
