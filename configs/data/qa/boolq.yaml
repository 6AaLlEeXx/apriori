dataset_name: boolq
upstream_dataset: google/boolq
output_dir: data/boolq
source:
  type: hf
  path: google/boolq
  splits:
    train: train
    test: validation
split:
  strategy: train_valid_existing_test
  seed: 42
  valid_ratio: 0.05
prompt_completion_mapping:
  type: template
  computed_fields:
    answer_text:
      lookup_index:
        index: answer
        labels: [no, yes]
  prompt_template: |-
    Read the passage and answer the yes/no question. Reply with only "yes" or "no".

    Passage:
    {passage}

    Question:
    {question}
  completion_template: "{answer_text}"
filters:
  max_prompt_chars: 4000
metadata:
  task: exact_match
  notes: BoolQ — 15.9k yes/no reading-comprehension questions over Wikipedia passages.
