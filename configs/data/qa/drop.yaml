dataset_name: drop
upstream_dataset: ucinlp/drop
output_dir: data/drop
source:
  type: hf
  path: ucinlp/drop
  splits:
    train: train
    test: validation
split:
  strategy: train_valid_existing_test
  seed: 42
  valid_ratio: 0.05
prompt_completion_mapping:
  type: template
  computed_fields:
    answer_text:
      first_non_empty:
        - answers_spans.spans.0
  prompt_template: |-
    Discrete reasoning over the passage. Answer concisely.

    Passage:
    {passage}

    Question:
    {question}
  completion_template: "{answer_text}"
filters:
  max_prompt_chars: 4000
  max_completion_chars: 200
metadata:
  task: exact_match
  notes: DROP — reading comprehension requiring counting, arithmetic, or span selection.
