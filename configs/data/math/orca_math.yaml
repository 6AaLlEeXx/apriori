dataset_name: orca_math
upstream_dataset: microsoft/orca-math-word-problems-200k
output_dir: data/orca_math
source:
  type: hf
  path: microsoft/orca-math-word-problems-200k
  split: train
  max_examples: 50000
split:
  strategy: ratios
  seed: 42
  valid_ratio: 0.02
  test_ratio: 0.02
prompt_completion_mapping:
  type: template
  prompt_template: |-
    Solve the following math word problem. Show your reasoning.

    Problem:
    {question}
  completion_template: "{answer}"
filters:
  max_prompt_chars: 2000
  max_completion_chars: 3000
  max_total_chars: 4500
metadata:
  task: gsm8k
  notes: 200k synthetic math word problems with rationales; subsetted to 50k by default.
