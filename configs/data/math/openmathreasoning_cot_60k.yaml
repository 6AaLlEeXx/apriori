dataset_name: openmathreasoning_cot_60k
source_dataset: nvidia/OpenMathReasoning
output_dir: data/openmathreasoning_cot_60k
source:
  type: hf
  path: nvidia/OpenMathReasoning
  split: "cot[:60000]"
split:
  strategy: ratios
  seed: 42
  valid_ratio: 0.05
  test_ratio: 0.05
mapping:
  type: template
  prompt_template: |-
    Solve the following math problem step by step. Keep the final answer clearly marked.

    Problem:
    {problem}
  completion_template: "{generated_solution}"
filters:
  max_prompt_chars: 2500
  max_completion_chars: 8000
  max_total_chars: 9500
  token_supervision:
    enabled: true
    tokenizer_model: mlx-community/Qwen3-14B-4bit
    max_seq_length: 1536
    min_supervised_tokens: 32
metadata:
  task: math_reasoning
  notes: Practical local slice of OpenMathReasoning CoT. Increase the HF split slice after the first run is stable.
