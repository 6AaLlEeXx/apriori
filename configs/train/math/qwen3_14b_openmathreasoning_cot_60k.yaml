extends: ../base/base.yaml
dataset_name: openmathreasoning_cot_60k
task: math_reasoning
base_model: mlx-community/Qwen3-14B-4bit
prepared_data_dir: data/openmathreasoning_cot_60k
run_tags:
  - mlx-lora
  - lora
  - qwen3-14b
  - openmathreasoning
  - math
evaluation:
  name: math_reasoning
  metrics:
    - exact_match
    - token_f1
    - gsm8k_answer_accuracy
  primary_metric: gsm8k_answer_accuracy
mlx_lora_args:
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 3.0e-6
  seed: 42
  mask_prompt: true
  iters: 1200
  num_layers: 12
  max_seq_length: 1536
  grad_checkpoint: true
  steps_per_report: 10
  steps_per_eval: 100
  val_batches: 20
  save_every: 200
  lora_parameters:
    rank: 8
    scale: 20.0
    dropout: 0.0
subset_training:
  iteration_scaling_policy: match_full_exposure
  min_iters: 1
notes: Qwen3-14B 4-bit math-reasoning LoRA on a 60k OpenMathReasoning CoT slice. Lower max_seq_length to 1024 if memory is tight.
